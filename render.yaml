services:
  - type: web
    name: triangle-pos
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: Triangle POS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: triangle-pos-db
          property: connectionString
      - key: DB_CONNECTION
        value: mysql

databases:
  - name: triangle-pos-db
    databaseName: triangle_pos
    user: triangle_pos_user
