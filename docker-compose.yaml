services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hamro-pos:latest
    container_name: hamro-pos-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-hamro_pos}
      - DB_USERNAME=${DB_USERNAME:-posuser}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - storage-data:/var/www/html/storage
      - ./public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hamro-network

  db:
    image: mysql:8.0
    container_name: hamro-pos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-hamro_pos}
      MYSQL_USER: ${DB_USERNAME:-posuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hamro-network

volumes:
  db-data:
    driver: local
  storage-data:
    driver: local

networks:
  hamro-network:
    driver: bridge


